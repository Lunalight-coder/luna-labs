<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna's Archives | Bookshelf</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* General Site Canvas Setup */
        body {
            background-color: #0b0f19;
            background-image: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            font-family: 'Quicksand', sans-serif;
            color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            margin-bottom: 40px;
        }

        /* 1. MAIN BOOKSHELF GRID LAYOUT */
        .library-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }

        .book-shelf-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .book-shelf-item:hover {
            transform: translateY(-8px);
        }

        .cover-wrapper {
            width: 200px;
            height: 280px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-size: cover;
            background-position: center;
        }

        #book-parallel .cover-wrapper { background-image: url('bgi.jpeg'); }
        #book-cookbook .cover-wrapper { background-image: url('bg.jpg'); }
        #book-soon .cover-wrapper { background-color: #1f2937; display: flex; align-items: center; justify-content: center; }

        .book-title-lbl {
            margin-top: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: #e2e8f0;
            text-align: center;
        }

        /* 2. SLIDE-OUT CARD PREVIEW LAYER */
        .preview-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 14, 0.85);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .preview-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .preview-card h2 { font-family: 'Orbitron', sans-serif; color: #00f2fe; margin-top: 0; }
        .preview-card p { font-size: 0.95rem; line-height: 1.5; color: #9ca3af; margin: 20px 0; }
        
        .btn-action {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-read { background: #00f2fe; color: #0b0f19; }
        .btn-back { background: #374151; color: #ffffff; }

        /* 3. FULL SCREEN KINDLE VIEW HOUSING */
        .kindle-viewport {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #090d16;
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer; /* Signal screen is clickable */
        }
        .kindle-page-sheet {
            background: #ffffff;
            color: #1f2937;
            width: 90%;
            max-width: 600px;
            height: 80vh;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            user-select: none; /* Prevents awkward text highlight drags while swiping */
        }
        .kindle-content {
            font-size: 1.05rem;
            line-height: 1.7;
            text-align: justify;
            margin: 0;
            height: 90%;
            overflow: hidden;
        }
        .kindle-footer {
            position: absolute;
            bottom: 15px; left: 0; width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #9ca3af;
        }
        .kindle-close-trigger {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.1);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 210;
        }
    </style>
</head>
<body>

    <h1>LUNA'S ARCHIVES</h1>

    <!-- BOOKS DISPLAY PACKET -->
    <div class="library-grid">
        <div class="book-shelf-item" id="book-parallel" onclick="openPreviewCard('parallel')">
            <div class="cover-wrapper"></div>
            <div class="book-title-lbl">Parallel Dreams</div>
        </div>

        <div class="book-shelf-item" id="book-cookbook" onclick="openPreviewCard('cookbook')">
            <div class="cover-wrapper"></div>
            <div class="book-title-lbl">My Space Cook Book</div>
        </div>

        <div class="book-shelf-item" id="book-soon">
            <div class="cover-wrapper" style="display:flex; align-items:center; justify-content:center;">
                <span style="font-family:'Orbitron'; font-size:0.8rem; color:#4b5563;">SOON</span>
            </div>
            <div class="book-title-lbl">Project Secret</div>
        </div>
    </div>

    <!-- PREVIEW SUMMARY POPUP OVERLAY -->
    <div class="preview-modal" id="previewModal">
        <div class="preview-card">
            <h2 id="metaTitle">Book Title</h2>
            <p id="metaDesc">Short introductory description of the content layout packets...</p>
            <button class="btn-action btn-read" onclick="startEreaderMode()">Read Book</button>
            <button class="btn-action btn-back" onclick="closePreviewCard()">Back</button>
        </div>
    </div>

    <!-- DISTRACTION FREE FULLSCREEN TEXT LAYER -->
    <div class="kindle-viewport" id="kindleViewport">
        <button class="kindle-close-trigger" onclick="shutdownEreaderMode(event)">✕ Exit Reader</button>
        
        <div class="kindle-page-sheet" id="pageSheet">
            <div class="kindle-content" id="readerContentTarget">
                <!-- Text chunks fill dynamically here -->
            </div>
            <div class="kindle-footer" id="readerPageNumber">Page 1 of 1</div>
        </div>
    </div>

    <script>
        // RAW COMPREHENSIVE DATA VALUE MATRIX
        const bookDatabase = {
            parallel: {
                title: "PARALLEL DREAMS",
                desc: "A gripping sci-fi narrative tracing timeline fractures across deep galactic dust networks and automated protocol rooms.",
                text: "The dark matter protocol hummed with an intense violet aura inside the space station core. Luna checked her automated terminal arrays as tracking variables computed the timeline distortions. Breaking the continuum loop was far easier than completing high school math assignments. For centuries, the galaxy had slept, blissfully unaware of the multi-dimensional cracks propagating outward from Sagittarius B2. Every shift in the field brought forward fragments of alternate realities—realities where humanity had mastered gravity fields before discovering fire. Luna reached for her control parameters, tuning down the matrix frequency limits to prevent data leakage. The console beeped aggressively in response, flashing neon amber overrides across the screen display modules. 'Absolute control requires absolute execution,' she whispered quietly into the audio interface mesh. The terminal clicked back into perfect calibration sync. Suddenly, a massive distortion vector spiked on the auxiliary channels, tracking an unknown target approaching the orbital sector boundary lines fast. If the shield field buckled now, the parallel timelines would collapse entirely into a singular point."
            },
            cookbook: {
                title: "MY SPACE COOK BOOK",
                desc: "Learn the high-precision chemistry needed to bake, fry, and freeze raw space molecules in zero-gravity environments.",
                text: "Welcome to the elemental kitchen grid! Baking cookies inside deep-space microgravity sectors requires breaking raw molecules down cleanly. First, extract crystal glycolaldehyde sweets floating near galactic center storms. Next, vaporize Orion Source I chlorine crystals to isolate cosmic salt variables base configuration. Make sure to neutralize your stardust components before processing! The physics of frying inside space anomalies demands managing volatile surface currents. Standard ovens fail entirely when thermal radiation distributes unevenly across zero-g environments. To build a perfect cosmic layer pastry, you must form active electromagnetic suspension bubbles that trap vanilla vapors tightly within your carbohydrate matrices. Keep monitoring your heat sensors closely—a single structural shift in the background gravity alignment field will drop your soufflé into a condensed quantum state, converting your delicious dessert back into pure particle mass!"
            }
        };

        let selectedBookKey = "";
        let parsedPagesArray = [];
        let readingPageIndex = 0;
        // 1. MODAL CONTROLLERS
        function openPreviewCard(bookKey) {
            selectedBookKey = bookKey;
            document.getElementById("metaTitle").innerText = bookDatabase[bookKey].title;
            document.getElementById("metaDesc").innerText = bookDatabase[bookKey].desc;
            document.getElementById("previewModal").style.display = "flex";
        }

        function closePreviewCard() {
            document.getElementById("previewModal").style.display = "none";
        }

        function startEreaderMode() {
            closePreviewCard();
            paginateRawText(bookDatabase[selectedBookKey].text);
            readingPageIndex = 0;
            renderKindlePageFace();
            document.getElementById("kindleViewport").style.display = "flex";
        }

        function shutdownEreaderMode(event) {
            event.stopPropagation(); // Prevents link click from firing page turn code beneath
            document.getElementById("kindleViewport").style.display = "none";
        }

        // 2. AUTOMATIC TEXT FIELD SEGMENTER
        function paginateRawText(fullText) {
            const words = fullText.split(" ");
            const wordsPerPageCount = 65; // Safe target display limit per view face
            parsedPagesArray = [];

            for (let i = 0; i < words.length; i += wordsPerPageCount) {
                let pageChunk = words.slice(i, i + wordsPerPageCount).join(" ");
                parsedPagesArray.push(pageChunk);
            }
        }

        function renderKindlePageFace() {
            document.getElementById("readerContentTarget").innerText = parsedPagesArray[readingPageIndex];
            document.getElementById("readerPageNumber").innerText = `Page ${readingPageIndex + 1} of ${parsedPagesArray.length}`;
        }

        // 3. TAP / CLICK NAVIGATION PIPELINES
        document.getElementById("kindleViewport").addEventListener("click", function(e) {
            // Find where the click landed relative to window screen sizing
            const screenWidth = window.innerWidth;
            const clickPositionX = e.clientX;

            if (clickPositionX > screenWidth / 2) {
                // Clicked right side -> Go Forward
                if (readingPageIndex < parsedPagesArray.length - 1) {
                    readingPageIndex++;
                    renderKindlePageFace();
                }
            } else {
                // Clicked left side -> Go Backward
                if (readingPageIndex > 0) {
                    readingPageIndex--;
                    renderKindlePageFace();
                }
            }
        });

        // 4. GESTURE SWIPE TRACKING RIGGING
        let touchStartX = 0;
        let touchEndX = 0;

        const swipeZone = document.getElementById("kindleViewport");

        swipeZone.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        swipeZone.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipeDirectionLogic();
        }, false);

        // Desktop mouse tracking adaptation strings
        swipeZone.addEventListener('mousedown', function(e) {
            touchStartX = e.screenX;
        }, false);

        swipeZone.addEventListener('mouseup', function(e) {
            touchEndX = e.screenX;
            handleSwipeDirectionLogic();
        }, false);

        function handleSwipeDirectionLogic() {
            const swipeThresholdDist = 40; // Minimum drag required to trigger swipe event
            
            if (touchStartX - touchEndX > swipeThresholdDist) {
                // Swiped Left to Right -> Turn Next Page
                if (readingPageIndex < parsedPagesArray.length - 1) {
                    readingPageIndex++;
                    renderKindlePageFace();
                }
            }
            
            if (touchEndX - touchStartX > swipeThresholdDist) {
                // Swiped Right to Left -> Turn Back Page
                if (readingPageIndex > 0) {
                    readingPageIndex--;
                    renderKindlePageFace();
                }
            }
        }
    </script>
</body>
</html>
